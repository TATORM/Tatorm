<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · TATO</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <style>
    :root { --bg:#fff; --fg:#0a0a0a; --dim:#888; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0a0a0a; --fg:#f0f0f0; --dim:#777; } }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: "Neue Haas Grotesk Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 500;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px; gap: 28px;
    }
    .wordmark { font-size: 1.4rem; letter-spacing: 0.34em; text-indent: 0.34em; }
    .msg { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
    nav { display: flex; gap: 26px; }
    nav a {
      font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--fg); text-decoration: none;
      border-bottom: 1px solid transparent; padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }
    nav a:hover { border-color: var(--fg); }
  </style>
  <!-- Pagina del sito non ancora generata (es. prodotto aggiunto su Shopify
       dopo l'ultimo build): 404.js la riapre dentro il sito. -->
  <script src="/404.js"></script>
</head>
<body>
  <p class="wordmark">TATO</p>
  <p class="msg">Page not found</p>
  <nav>
    <a href="/">Home</a>
    <a href="/#shop">Shop</a>
  </nav>
</body>
</html>
