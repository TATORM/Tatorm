<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TATO — Shop UI Test</title>
  <style>
    /* ── Font + Reset ── */
    :root {
      --black:      #0a0a0a;
      --gray:       #888888;
      --gray-light: #d8d8d8;
      --white:      #ffffff;
      --font: "Neue Haas Grotesk Display", "Neue Haas Grotesk Text",
              "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      background: #f5f5f3;
      color: var(--black);
      min-height: 100vh;
    }
    button {
      background: none; border: none; cursor: pointer;
      font-family: var(--font); font-weight: 500;
      color: inherit; padding: 0;
    }
    .hidden { display: none !important; }

    /* ── Header barra di test ── */
    .test-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 200;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
    }
    .test-bar-label { opacity: 0.5; }
    .test-bag-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--white);
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      position: relative;
    }
    .test-bag-btn svg { width: 18px; height: 18px; }
    .cart-badge {
      position: absolute;
      top: -5px; right: -8px;
      min-width: 14px; height: 14px;
      border-radius: 7px;
      background: var(--white);
      color: var(--black);
      font-size: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      pointer-events: none;
    }

    /* ── Layout principale ── */
    .main {
      margin-top: 48px;
      display: flex;
      gap: 0;
      min-height: calc(100vh - 48px);
    }

    /* ── Pannello collezione (sinistra) ── */
    .collection-panel {
      flex: 1;
      padding: 40px 40px 40px 60px;
      max-width: 640px;
    }
    .collection-title {
      font-size: 0.55rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 48px;
    }

    .look-block {
      margin-bottom: 60px;
      padding-bottom: 60px;
      border-bottom: 1px solid var(--gray-light);
    }
    .look-block:last-child { border-bottom: none; }

    .look-number {
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-decoration: underline;
      text-underline-offset: 4px;
      margin-bottom: 24px;
    }

    .look-items { display: flex; flex-direction: column; gap: 24px; }

    /* ── Singolo item ── */
    .item-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 20px;
      align-items: start;
    }
    .item-left { grid-column: 1; }
    .item-right { grid-column: 2; text-align: right; }

    .item-name {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .item-info {
      font-size: 0.62rem;
      color: var(--gray);
      line-height: 1.7;
    }
    .item-price {
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--black);
      white-space: nowrap;
    }

    /* Taglia + add: span tutta la larghezza */
    .item-size-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .size-label {
      font-size: 0.52rem;
      letter-spacing: 0.14em;
      color: var(--gray);
    }
    .size-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .size-btn {
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      border: 1px solid var(--gray-light);
      background: none;
      color: var(--black);
      padding: 3px 7px;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .size-btn:hover { border-color: var(--black); }
    .size-btn.selected {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }
    .add-btn {
      margin-left: auto;
      font-size: 0.52rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
      border-bottom: 1px solid var(--gray-light);
      padding-bottom: 2px;
      background: none;
      border-top: none; border-left: none; border-right: none;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 500;
      transition: color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }
    .add-btn:hover { color: var(--black); border-color: var(--black); }
    .add-btn:disabled { color: var(--gray); cursor: default; opacity: 0.5; }
    .add-btn.confirmed { color: var(--black); border-color: var(--black); }

    @keyframes size-pulse {
      0%, 100% { opacity: 1; }
      40% { opacity: 0.2; }
    }
    .size-required { animation: size-pulse 0.55s ease; }

    /* ── CART DRAWER ── */
    .cart-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(0,0,0,0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .cart-overlay.open { opacity: 1; pointer-events: auto; }

    .cart-drawer {
      position: fixed;
      top: 0; right: 0;
      width: 340px;
      height: 100dvh;
      z-index: 160;
      background: #f3f3ef;
      border-left: 1px solid rgba(17,17,17,0.10);
      box-shadow: -4px 0 32px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.36s cubic-bezier(0.22,1,0.36,1);
      font-family: var(--font);
    }
    .cart-drawer.open { transform: translateX(0); }

    .cart-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px;
      border-bottom: 1px solid rgba(17,17,17,0.10);
      flex-shrink: 0;
    }
    .cart-drawer-title {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #111;
      font-weight: 500;
    }
    .cart-close {
      width: 18px; height: 18px;
      background: transparent; border: 0;
      cursor: pointer; position: relative;
      opacity: 0.5; transition: opacity 0.2s;
    }
    .cart-close:hover { opacity: 1; }
    .cart-close::before, .cart-close::after {
      content: ""; position: absolute;
      top: 8px; left: 0;
      width: 18px; height: 1px; background: #111;
    }
    .cart-close::before { transform: rotate(45deg); }
    .cart-close::after  { transform: rotate(-45deg); }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .cart-empty {
      font-size: 0.64rem;
      color: rgba(17,17,17,0.4);
      letter-spacing: 0.06em;
      margin-top: 4px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(17,17,17,0.08);
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 3px;
    }
    .cart-item-meta {
      font-size: 0.56rem;
      color: rgba(17,17,17,0.5);
      line-height: 1.6;
      margin-bottom: 2px;
    }
    .cart-item-look {
      font-size: 0.52rem;
      color: rgba(17,17,17,0.35);
      letter-spacing: 0.06em;
    }
    .cart-item-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .cart-item-price {
      font-size: 0.64rem;
      color: #111;
      letter-spacing: 0.04em;
    }
    .cart-remove-btn {
      font-size: 16px;
      color: rgba(17,17,17,0.35);
      background: none; border: none;
      cursor: pointer; padding: 0;
      font-family: inherit; font-weight: 300;
      line-height: 1; transition: color 0.2s;
    }
    .cart-remove-btn:hover { color: #111; }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid rgba(17,17,17,0.10);
      flex-shrink: 0;
    }
    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
    }
    .cart-total-label {
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #111;
    }
    .cart-total-value {
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: #111;
    }
    .cart-checkout-btn {
      width: 100%;
      height: 38px;
      background: #111;
      color: #f3f3ef;
      border: none;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .cart-checkout-btn:hover { opacity: 0.75; }
    .cart-note {
      font-size: 0.54rem;
      color: rgba(17,17,17,0.35);
      text-align: center;
      letter-spacing: 0.04em;
    }

    @media (max-width: 768px) {
      .collection-panel { padding: 24px 20px; }
      .cart-drawer { width: 100vw; border-left: none; }
      .item-card { grid-template-columns: 1fr; }
      .item-right { text-align: left; grid-column: 1; }
    }
  </style>
</head>
<body>

        { name: '2 BUTTON LONG SKIRT',  info: ['100% Cotton', 'Color: Shiny White'] }
      ]}
    ];

    /* ── Stato carrello ── */
    let cart = [];
    let cartNextId = 0;

    /* ── Render lista look ── */
    function buildLooks() {
      const container = document.getElementById('looks-container');
      lookData.forEach(look => {
        const block = document.createElement('div');
        block.className = 'look-block';
        block.innerHTML = `
          <p class="look-number">${look.number}</p>
          <div class="look-items">
            ${look.items.map((item, idx) => {
              const price = itemPrices[item.name] || 0;
              const color = item.info.find(i => i.startsWith('Color:')) || '';
              return `
                <div class="item-card" data-look="${look.number}" data-item-idx="${idx}" data-name="${item.name}" data-price="${price}" data-color="${color}">
                  <div class="item-left">
                    <p class="item-name">${item.name}</p>
                    ${item.info.map(i => `<p class="item-info">${i}</p>`).join('')}
                  </div>
                  <div class="item-right">
                    <p class="item-price">€${price}</p>
                  </div>
                  <div class="item-size-row">
                    <span class="size-label">Size</span>
                    <div class="size-btns">
                      ${['XS','S','M','L','XL'].map(s => `<button class="size-btn" data-size="${s}">${s}</button>`).join('')}
                    </div>
                    <button class="add-btn">ADD TO CART</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        container.appendChild(block);
      });

      /* Wiring size buttons */
      document.querySelectorAll('.item-card').forEach(card => {
        card.querySelectorAll('.size-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            card.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
          });
        });

        card.querySelector('.add-btn').addEventListener('click', () => {
          const selected = card.querySelector('.size-btn.selected');
          const sizeRow = card.querySelector('.item-size-row');
          if (!selected) {
            sizeRow.classList.add('size-required');
            setTimeout(() => sizeRow.classList.remove('size-required'), 600);
            return;
          }
          addToCart({
            name:  card.dataset.name,
            price: parseInt(card.dataset.price),
            look:  card.dataset.look,
            color: card.dataset.color,
            size:  selected.dataset.size,
          });
          const addBtn = card.querySelector('.add-btn');
          addBtn.textContent = 'ADDED ✓';
          addBtn.classList.add('confirmed');
          addBtn.disabled = true;
          setTimeout(() => {
            addBtn.textContent = 'ADD TO CART';
            addBtn.classList.remove('confirmed');
            addBtn.disabled = false;
          }, 1600);
        });
      });
    }

    /* ── Carrello ── */
    function addToCart(item) {
      cart.push({ id: cartNextId++, ...item });
      updateBadge();
      renderCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      updateBadge();
      renderCart();
    }

    function updateBadge() {
      const badge = document.getElementById('cart-badge');
      badge.textContent = cart.length;
      badge.classList.toggle('hidden', cart.length === 0);
    }

    function renderCart() {
      const body   = document.getElementById('cart-body');
      const footer = document.getElementById('cart-footer');

      if (cart.length === 0) {
        body.innerHTML = '<p class="cart-empty">Il carrello è vuoto.</p>';
        footer.classList.add('hidden');
        return;
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);

      body.innerHTML = cart.map(item => `
        <div class="cart-item-row">
          <div class="cart-item-info">
            <p class="cart-item-name">${item.name}</p>
            <p class="cart-item-meta">${item.size}${item.color ? ' · ' + item.color : ''}</p>
            <p class="cart-item-look">${item.look}</p>
          </div>
          <div class="cart-item-right">
            <p class="cart-item-price">€${item.price}</p>
            <button class="cart-remove-btn" data-id="${item.id}" aria-label="Rimuovi">×</button>
          </div>
        </div>
      `).join('');

      footer.classList.remove('hidden');
      document.getElementById('cart-total').textContent = `€${total}`;

      body.querySelectorAll('.cart-remove-btn').forEach(btn => {
        btn.addEventListener('click', () => removeFromCart(parseInt(btn.dataset.id)));
      });
    }

    function openCart() {
      document.getElementById('cart-drawer').classList.add('open');
      document.getElementById('cart-overlay').classList.add('open');
      document.getElementById('cart-drawer').setAttribute('aria-hidden', 'false');
    }

    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('open');
      document.getElementById('cart-overlay').classList.remove('open');
      document.getElementById('cart-drawer').setAttribute('aria-hidden', 'true');
    }

    /* ── Init ── */
    buildLooks();

    document.getElementById('btn-open-cart').addEventListener('click', openCart);
    document.getElementById('cart-close').addEventListener('click', closeCart);
    document.getElementById('cart-overlay').addEventListener('click', closeCart);

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCart(); });
  </script>
</body>
</html>
