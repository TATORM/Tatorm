name: Lighthouse CI

# Audita performance + a11y sulla build reale (npm run build, come va online).
# Preset mobile di default (throttled) — più severo, coerente con l'impostazione
# mobile-first del sito. Performance è "warn" non "error": sui runner condivisi
# di GitHub Actions il punteggio perf oscilla parecchio (CPU non dedicata) anche
# con il throttling di Lighthouse CI, quindi non deve far fallire la CI da solo.
# L'accessibilità è deterministica → resta "error" con soglia 0.95.

on:
  push:
    branches: [main, ecommerce-dev]
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc.json
