name: Deploy to GitHub Pages

# Attenzione: perché questo workflow deployi davvero, il repo deve avere
# Settings → Pages → Source = "GitHub Actions" (oggi è "Deploy from a branch").
# Cambiare quella impostazione modifica come si aggiorna tatorm.com.
# Finché il lavoro è su ecommerce-dev il workflow non parte (trigger su main).

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Ogni 30 minuti: ricostruisce con la copia aggiornata del catalogo
  # Shopify (prodotti nuovi/tolti visibili subito anche in Home e al
  # primo caricamento; prezzi e stock sono comunque sempre dal vivo).
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # stessi test di test.yml: se falliscono il sito NON va online
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - uses: actions/configure-pages@v5
      # online va SOLO _site/ (vedi scripts/build.mjs → PUBLIC)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
